<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    
    <!-- ✅ VERY IMPORTANT FOR MOBILE -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Keyboard Event Detector</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="card">
    <h2>Keyboard Event Detector</h2>

    <!-- Input Area -->
    <div class="input-box">
        <input type="text" id="inputField" 
               placeholder="Click here and press keys">
        <small id="focusStatus">Not Focused</small>
    </div>

    <!-- Key Information -->
    <div class="info">
        <p><strong>Key Value:</strong> <span id="keyValue">-</span></p>
        <p><strong>Key Code:</strong> <span id="keyCode">-</span></p>
        <p><strong>Event Type:</strong> <span id="eventType">-</span></p>
        <p>
            <strong>Shift:</strong> <span id="shift">false</span> |
            <strong>Ctrl:</strong> <span id="ctrl">false</span> |
            <strong>Alt:</strong> <span id="alt">false</span>
        </p>
    </div>

    <!-- Event Log -->
    <div id="log"></div>

    <button onclick="clearLog()">Clear Log</button>
</div>

<script src="script.js"></script>
</body>
</html>
